<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🥕 A little something for you</title>
<style>
:root {
  --ink: #371a17;
  --soft: #714139;
  --leaf: #2f8f51;
  --clay: #b83c33;
  --line: #e7cdbb;
  --shadow: rgba(72,32,22,0.16);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  min-height: 100vh;
  display: grid;
  place-items: center;
  font-family: ui-rounded, "SF Pro Rounded", "Nunito", system-ui, sans-serif;
  color: var(--ink);
  background: radial-gradient(circle at 28% 18%, rgba(255,215,120,0.32), transparent 28%),
              linear-gradient(180deg, #fffaf2 0%, #f6eadb 100%);
  padding: 20px;
}

/* ── MAKER (your private side) ── */
.maker {
  display: grid;
  gap: 16px;
  padding: 32px 24px;
  border: 2px solid var(--line);
  border-radius: 16px;
  background: rgba(255,252,247,0.95);
  box-shadow: 0 18px 42px var(--shadow);
  max-width: 380px;
  width: 100%;
}
.maker-title { font-size: 18px; font-weight: 900; text-align: center; }
.maker-sub { font-size: 13px; color: var(--soft); text-align: center; margin-top: -8px; }
.field { display: grid; gap: 6px; }
.field label { font-size: 13px; font-weight: 800; color: var(--soft); text-transform: lowercase; }
.field input, .field textarea {
  width: 100%; border: 2px solid var(--line); border-radius: 8px;
  background: #fffdf9; color: var(--ink); font: inherit;
  font-size: 15px; padding: 10px 12px; outline: none; transition: border 0.15s;
}
.field input:focus, .field textarea:focus { border-color: var(--leaf); }
.field textarea { resize: vertical; min-height: 72px; }
.link-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
.link-input {
  width: 100%; border: 2px solid var(--line); border-radius: 8px;
  background: #f5ede3; color: var(--soft); font: inherit;
  font-size: 12px; padding: 8px 12px; outline: none;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.btn-copy {
  padding: 8px 16px; border: none; border-radius: 8px;
  background: var(--clay); color: white; font: inherit;
  font-size: 13px; font-weight: 800; cursor: pointer; white-space: nowrap;
}
.btn-copy:hover { opacity: 0.85; }
.copy-status { font-size: 12px; color: var(--leaf); font-weight: 800; min-height: 18px; text-align: right; }
.btn-preview {
  width: 100%; padding: 12px; border: 2px solid var(--leaf);
  border-radius: 8px; background: transparent; color: var(--leaf);
  font: inherit; font-size: 14px; font-weight: 800; cursor: pointer; transition: all 0.15s;
}
.btn-preview:hover { background: var(--leaf); color: white; }

/* ── RECEIVER (what they see) ── */
.receiver {
  display: none; flex-direction: column;
  align-items: center; gap: 24px;
  padding: 48px 24px;
  border: 2px solid var(--line); border-radius: 16px;
  background: rgba(255,252,247,0.95);
  box-shadow: 0 18px 42px var(--shadow);
  max-width: 320px; width: 100%; text-align: center;
}
.receiver.show { display: flex; }
.hint { font-size: 15px; color: var(--soft); }

/* POT */
.pot-btn {
  position: relative; width: 160px; height: 160px;
  border: none; background: transparent;
  cursor: pointer; border-radius: 12px;
  transition: transform 160ms ease; font-size: 0;
}
.pot-btn:hover { transform: translateY(-4px); }
.pot-btn:active { transform: scale(0.95); }
.pot-btn.popped { animation: pop 360ms ease both; }

.pot-face {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  transition: opacity 200ms, transform 200ms;
}
.pot-face img { width: 130px; image-rendering: pixelated; }
.pot-face.gone { opacity: 0; transform: scale(0.85); pointer-events: none; }

.recv-msg {
  font-size: clamp(18px,5vw,22px); font-weight: 800;
  line-height: 1.35; color: var(--ink);
  opacity: 0; transform: translateY(8px);
  transition: opacity 250ms, transform 250ms; padding: 0 8px;
}
.recv-msg.show { opacity: 1; transform: translateY(0); }

.recv-from {
  font-size: 14px; color: var(--soft);
  opacity: 0; transition: opacity 400ms ease 200ms;
}
.recv-from.show { opacity: 1; }

.back-btn {
  font-size: 12px; color: var(--soft); background: none;
  border: none; cursor: pointer; text-decoration: underline; font: inherit;
}

@keyframes pop {
  0%   { transform: scale(1); }
  45%  { transform: translateY(-10px) scale(1.12); }
  100% { transform: scale(1); }
}
</style>
</head>
<body>

<!-- YOUR MAKER PAGE — only you see this -->
<div class="maker" id="makerView">
  <div class="maker-title">🥕 carrot card maker</div>
  <p class="maker-sub">write your message · copy the link · send on whatsapp</p>

  <div class="field">
    <label>your message</label>
    <textarea id="msgInput" placeholder="I grew this tiny carrot just for you!">I grew this tiny carrot just for you!</textarea>
  </div>

  <div class="field">
    <label>from</label>
    <input type="text" id="fromInput" placeholder="— Neet 🌸" value="— Neet 🌸"/>
  </div>

  <div class="field">
    <label>your shareable link — send this on whatsapp</label>
    <div class="link-row">
      <input class="link-input" id="linkOut" readonly/>
      <button class="btn-copy" onclick="copyLink()">copy</button>
    </div>
    <p class="copy-status" id="copyStatus"></p>
  </div>

  <button class="btn-preview" onclick="preview()">preview what they see 👀</button>
</div>

<!-- THEIR PAGE — what your husband sees -->
<div class="receiver" id="receiverView">
  <p class="hint" id="hint">tap to open 🌱</p>

  <button class="pot-btn" id="potBtn" onclick="tapPot()">
    <!-- EMPTY POT — shows before tap -->
    <div class="pot-face" id="potEmpty">
      <img src="empty-pot.png" alt="pot"/>
    </div>
    <!-- CARROT — shows after tap -->
    <div class="pot-face gone" id="potFull">
      <img src="carrot-pot.png" alt="carrot"/>
    </div>
  </button>

  <p class="recv-msg" id="recvMsg"></p>
  <p class="recv-from" id="recvFrom"></p>
  <button class="back-btn" id="backBtn" onclick="goBack()" style="display:none">← make your own</button>
</div>

<script>
let grown = false;
let resetTimer;

function buildLink() {
  const msg  = document.getElementById('msgInput').value.trim() || 'I grew this for you!';
  const from = document.getElementById('fromInput').value.trim() || '🌸';
  const url  = new URL(window.location.href);
  url.searchParams.set('msg',  msg);
  url.searchParams.set('from', from);
  document.getElementById('linkOut').value = url.toString();
  document.getElementById('copyStatus').textContent = '';
}

async function copyLink() {
  buildLink();
  try {
    await navigator.clipboard.writeText(document.getElementById('linkOut').value);
    document.getElementById('copyStatus').textContent = '✓ copied! send it on whatsapp 🌸';
  } catch {
    document.getElementById('copyStatus').textContent = 'select and copy manually';
  }
}

function preview() {
  const msg  = document.getElementById('msgInput').value.trim() || 'I grew this for you!';
  const from = document.getElementById('fromInput').value.trim() || '🌸';
  showReceiver(msg, from, true);
}

function showReceiver(msg, from, isPreview) {
  document.getElementById('makerView').style.display = 'none';
  document.getElementById('recvMsg').textContent  = msg;
  document.getElementById('recvFrom').textContent = from;
  document.getElementById('backBtn').style.display = isPreview ? 'block' : 'none';
  document.getElementById('receiverView').classList.add('show');
}

function tapPot() {
  if(grown) { resetPot(); return; }
  grown = true;
  document.getElementById('potBtn').classList.add('popped');
  document.getElementById('potEmpty').classList.add('gone');
  document.getElementById('potFull').classList.remove('gone');
  document.getElementById('hint').textContent = 'a little something for you 🥕';
  document.getElementById('recvMsg').classList.add('show');
  document.getElementById('recvFrom').classList.add('show');
  clearTimeout(resetTimer);
  resetTimer = setTimeout(resetPot, 12000);
}

function resetPot() {
  grown = false;
  document.getElementById('potBtn').classList.remove('popped');
  document.getElementById('potEmpty').classList.remove('gone');
  document.getElementById('potFull').classList.add('gone');
  document.getElementById('hint').textContent = 'tap to open 🌱';
  document.getElementById('recvMsg').classList.remove('show');
  document.getElementById('recvFrom').classList.remove('show');
}

function goBack() {
  document.getElementById('receiverView').classList.remove('show');
  document.getElementById('makerView').style.display = 'grid';
  resetPot();
}

document.getElementById('msgInput').addEventListener('input', buildLink);
document.getElementById('fromInput').addEventListener('input', buildLink);

// On load — if link has ?msg= show receiver, otherwise show maker
const params = new URLSearchParams(window.location.search);
if(params.get('msg')) {
  showReceiver(
    params.get('msg')  || 'I grew this for you!',
    params.get('from') || '🌸',
    false
  );
} else {
  buildLink();
}
</script>
</body>
</html>
